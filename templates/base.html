<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPath - IB & Odoo ERP Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <nav class="bg-[#714B67] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="flex items-center space-x-2 font-bold text-xl">
        <span>🎓 EduPath IB</span>
        <span class="text-xs bg-teal-500 text-white px-2 py-0.5 rounded-full">Odoo ERP</span>
      </a>
      <div class="flex items-center space-x-4 text-sm">
        {% if user %}
          {% if user.role == 'teacher' %}
            <a href="/teacher" class="hover:underline">Самбар</a>
            <a href="/scores" class="hover:underline">Дүн</a>
          {% else %}
            <a href="/student" class="hover:underline">Самбар</a>
          {% endif %}
          <span class="bg-white/20 px-3 py-1 rounded-lg">👤 {{ user.name or user.username }} ({{ user.role }})</span>
          <a href="/logout" class="bg-rose-500 hover:bg-rose-600 px-3 py-1 rounded-lg transition">Гарах</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-4 text-xs text-slate-400 border-t bg-white">
    EduPath Platform &copy; 2026. Powered by Google Gemini 2.5 Flash & IB Assessment Criteria.
  </footer>
</body>
</html>
